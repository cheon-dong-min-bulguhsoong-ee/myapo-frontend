name: Deploy app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"

env:
  APP_PORT: "10000"
  CONTAINER_NAME: myapo-frontend
  IMAGE_NAME: myapo-frontend

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            ./app

      - name: Restart container
        run: |
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${APP_PORT}:${APP_PORT}" \
            -e PORT="${APP_PORT}" \
            -e HOSTNAME="0.0.0.0" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          docker image prune -f
