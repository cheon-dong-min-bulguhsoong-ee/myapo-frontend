<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
<div class="cap" style="margin-bottom:14px;">Semantic · status only — never decoration</div>
<div class="grid-3">
<div class="sw"><span class="fill" style="background:#25A768"></span><div class="info"><div class="nm" style="color:#25A768">Success · GA</div><div class="hx">#25A768 · --green</div></div></div>
<div class="sw"><span class="fill" style="background:#F1A31F"></span><div class="info"><div class="nm" style="color:#F1A31F">Partial · Warn</div><div class="hx">#F1A31F · --yellow</div></div></div>
<div class="sw"><span class="fill" style="background:#F04452"></span><div class="info"><div class="nm" style="color:#F04452">Risk · Strike</div><div class="hx">#F04452 · --red</div></div></div>
</div>
<div class="row" style="margin-top:14px; gap:8px;">
<span class="chip green">Live</span><span class="chip yellow">Partial</span><span class="chip red">Risk</span><span class="chip gray">Neutral</span>
</div>
</div></body></html>
