<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
<div class="cap" style="margin-bottom:14px;">Icon approach · Unicode glyphs — no icon library</div>
<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px;">
<div style="background:var(--bg-soft); padding:14px; border-radius:12px; text-align:center;"><div style="font-size:28px; font-family:'Work Sans'; font-weight:600; color:var(--blue); line-height:1;">✓</div><div style="font-size:10px; color:var(--ink-4); margin-top:6px; font-family:'Work Sans'; font-weight:600; letter-spacing:0.04em;">YES</div></div>
<div style="background:var(--bg-soft); padding:14px; border-radius:12px; text-align:center;"><div style="font-size:28px; font-family:'Work Sans'; font-weight:600; color:var(--ink-5); line-height:1;">✕</div><div style="font-size:10px; color:var(--ink-4); margin-top:6px; font-family:'Work Sans'; font-weight:600; letter-spacing:0.04em;">NO</div></div>
<div style="background:var(--bg-soft); padding:14px; border-radius:12px; text-align:center;"><div style="font-size:28px; font-family:'Work Sans'; font-weight:600; color:var(--yellow); line-height:1;">△</div><div style="font-size:10px; color:var(--ink-4); margin-top:6px; font-family:'Work Sans'; font-weight:600; letter-spacing:0.04em;">PARTIAL</div></div>
<div style="background:var(--bg-soft); padding:14px; border-radius:12px; text-align:center;"><div style="font-size:28px; font-family:'Work Sans'; font-weight:600; color:var(--ink-3); line-height:1;">·</div><div style="font-size:10px; color:var(--ink-4); margin-top:6px; font-family:'Work Sans'; font-weight:600; letter-spacing:0.04em;">SEP</div></div>
</div>
<div style="font-size:11px; color:var(--ink-3); margin-top:12px; line-height:1.5; font-weight:500;">시스템에 아이콘 폰트 없음. 숫자 마커(01/02/03), blue dot bullet, Unicode ✓✕△가 대부분의 아이콘 역할.</div>
</div></body></html>
